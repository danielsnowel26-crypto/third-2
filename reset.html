<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="all.css">
</head>
<body class="reset-page">
    <div class="auth-card">
    <a class="logo" href="index.html"><img src="logo/nexora-logo-stacked.svg" alt="Nexora - Banking Beyond Limits"></a>
    <ol class="steps">
        <li class="done"><strong>1</strong>Enter email</li>
        <li><strong>2</strong>Check inbox</li>
        <li><strong>3</strong>Reset password</li>
    </ol>
    <div class="reset-container">
        <h1>Reset Your Password</h1>
        <p>Please enter your email address to receive instructions for resetting your password.</p>

        <form action="reset-form">
            <label for="email">Email:</label>
            <input type="email"
             id="email"
              placeholder="Enter your email" required>

            <button type="submit">Send Reset Link</button>
            <a href="login.html">→ Back to Login</a>
        </form>
    </div>
    </div>
    <p class="secure"><img src="icons/shield.svg" alt="">Don't worry, it happens. We'll help you get back in.</p>
</body>
</html>
