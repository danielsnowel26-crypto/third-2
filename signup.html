<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration / Sign Up</title>
</head>
<body>
    <img src="logo/nexora-logo-horizontal.svg" alt="Nexora - Banking Beyond Limits">
    <h1>Create Your Account</h1>
    <p>Join millions of users worldwide and experience the future of banking.</p>

    <form action="signup-form">
        <label for="name">Full Name</label>
        <input type="text"
         id="name"
         placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email"
         id="email"
          placeholder="Enter your email" required>

          label for="phone">Phone Number</label>
        <input type="tel"
         id="phone"
         placeholder="Enter your phone number" required>

            <label for="password">Password</label>
            <input type="password"
            id="password"
            placeholder="Enter your password" required>

            label for="confirm-password">Confirm Password</label>
            <input type="password"
            id="confirm-password"
            placeholder="Confirm your password" required>

            <p class="checkmark">
                <input type="checkbox" id="terms" required>
                I agree to the <a href="#terms">Terms and Conditions</a>
                and <a href="#privacy">Privacy Policy</a>.

            <button type="submit">Sign Up</button>
            <a>Already have an account? <a href="login.html">Log in</a>
</body>
</html>
