<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration / Sign Up</title>
    <link rel="stylesheet" href="all.css">
</head>
<body class="signup-page">
    <div class="auth-card">
    <a class="logo" href="index.html"><img src="logo/nexora-logo-stacked.svg" alt="Nexora - Banking Beyond Limits"></a>
    <h1>Create Your Account</h1>
    <p>Join millions of users worldwide and experience the future of banking.</p>

    <form action="signup-form">
        <label for="name">Full Name</label>
        <input type="text"
         id="name"
         placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email"
         id="email"
          placeholder="Enter your email" required>

          <label for="phone">Phone Number</label>
        <input type="tel"
         id="phone"
         placeholder="Enter your phone number" required>

            <label for="password">Password</label>
            <input type="password"
            id="password"
            placeholder="Enter your password" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password"
            id="confirm-password"
            placeholder="Confirm your password" required>

            <p class="checkmark">
                <input type="checkbox" id="terms" required>
                I agree to the <a href="#terms">Terms and Conditions</a>
                and <a href="#privacy">Privacy Policy</a>.
            </p>

            <button type="submit">Sign Up</button>
            <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </form>
    </div>
</body>
</html>
